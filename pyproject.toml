[project]
name = "server"
version = "0.1.0"
description = "Track 3 Telemetry API Server"
readme = "README.md"
authors = [
    { email = "jzzairi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.53.0",
]

[project.scripts]
server = "server:main"
track-3-dev = "server:main"
seed = "server.seed:seed_database"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "server:app"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
    "ignore:.*BlockingPortal alias is deprecated.*:DeprecationWarning",
]
